<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Moulding Admin · Keystone Wood Specialties</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; }
    body { margin: 0; background: #f4f6f9; color: #151d2b; font: 14px/1.5 system-ui, sans-serif; }
    header { background: #fff; border-bottom: 1px solid #dce2ea; padding-block: 21px; }
    .shell { width: min(100% - 32px, 900px); margin-inline: auto; }
    header p { margin: 0; color: #526076; font-weight: 650; font-size: .82rem; }
    h1 { margin: 2px 0 0; font-size: clamp(1.65rem, 4vw, 2rem); letter-spacing: -.04em; }
    h2 { margin: 0 0 10px; font-size: 1.05rem; }
    main { padding-block: 18px 35px; }
    .panel { border: 1px solid #dce2ea; border-radius: 14px; background: white; padding: 18px; margin-bottom: 14px; }
    .muted { color: #526076; }
    label { display: block; font-weight: 650; margin-bottom: 5px; }
    input, button { font: inherit; border: 1px solid #cfd7e2; border-radius: 7px; min-height: 40px; padding: 8px 10px; color: inherit; background: white; }
    input { width: 100%; }
    button { font-weight: 650; cursor: pointer; }
    button:hover:not(:disabled) { background: #f7f8fa; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .primary { background: #315bd5; border-color: #315bd5; color: white; }
    .primary:hover:not(:disabled) { background: #2347b1; }
    :focus-visible { outline: 3px solid #315bd5; outline-offset: 3px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 13px; }
    small { display: block; margin-top: 4px; }
    #message { min-height: 20px; margin: 9px 0 0; color: #37455c; }
    #message.error { color: #8f322a; }
    .table-wrap { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 8px 9px; border-bottom: 1px solid #e5eaf1; text-align: left; white-space: nowrap; }
    th { color: #526076; background: #f0f3f7; }
    .row-actions { display: flex; justify-content: end; gap: 5px; }
    .row-actions button { min-height: 34px; padding: 5px 9px; }
    @media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header><div class="shell"><p>Keystone Wood Specialties</p><h1>Moulding Admin</h1></div></header>
  <main class="shell">
    <section class="panel">
      <h2>Run override</h2>
      <form id="override-form">
        <fieldset id="fields" disabled style="border:0;padding:0;margin:0;min-width:0">
          <div class="fields">
            <div><label for="number">Moulding number</label><input id="number" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="5008" required></div>
            <div><label for="width">Run width (inches)</label><input id="width" placeholder="1 3/4 or 1.75" aria-describedby="width-help"><small class="muted" id="width-help">Leave blank to use the schedule width.</small></div>
            <div><label for="sticks">Sticks per pass</label><input id="sticks" type="number" min="1" step="1" placeholder="1" aria-describedby="sticks-help"><small class="muted" id="sticks-help">Set to 2 for two sticks at once.</small></div>
          </div>
          <button class="primary" type="submit">Save override</button>
        </fieldset>
      </form>
      <p id="message" role="status">Loading overrides…</p>
    </section>
    <section class="panel">
      <h2>Saved overrides</h2>
      <p id="empty" class="muted" hidden>No overrides saved.</p>
      <div class="table-wrap"><table id="table" hidden>
        <thead><tr><th>Moulding</th><th>Run width</th><th>Sticks per pass</th><th><span class="muted">Actions</span></th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </section>
  </main>
  <script type="module">
    const $ = id => document.getElementById(id);
    let revision = 0;
    let overrides = {};
    let busy = false;

    function message(text, isError = false) {
      $('message').textContent = text;
      $('message').classList.toggle('error', isError);
    }

    function render() {
      $('fields').disabled = busy || revision === 0;
      const entries = Object.entries(overrides).sort(([a], [b]) => a.localeCompare(b));
      $('empty').hidden = revision === 0 || entries.length > 0;
      $('table').hidden = entries.length === 0;
      const rows = entries.map(([number, setting]) => {
        const row = document.createElement('tr');
        for (const text of [number, setting.widthInches == null ? 'Schedule width' : setting.widthInches + '″', setting.sticksPerPass ?? '1']) {
          const cell = document.createElement('td');
          cell.textContent = text;
          row.append(cell);
        }
        const actions = document.createElement('td');
        actions.className = 'row-actions';
        for (const label of ['Edit', 'Remove']) {
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = label;
          button.setAttribute('aria-label', label + ' override for ' + number);
          button.disabled = busy;
          button.onclick = () => {
            if (label === 'Remove') {
              if (confirm('Remove the override for moulding ' + number + '?')) save(number, null, null);
              return;
            }
            $('number').value = number;
            $('width').value = setting.widthInches ?? '';
            $('sticks').value = setting.sticksPerPass ?? '';
            $('width').focus();
          };
          actions.append(button);
        }
        row.append(actions);
        return row;
      });
      $('rows').replaceChildren(...rows);
    }

    async function request(payload) {
      const options = payload ? { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) } : {};
      const response = await fetch('/api/admin/overrides', { ...options, cache: 'no-store', redirect: 'error' });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = Error(data.error || 'Could not load moulding overrides.');
        error.status = response.status;
        throw error;
      }
      revision = data.revision;
      overrides = data.overrides;
    }

    function parseWidth(raw) {
      const text = raw.trim().replace(/[″"]$/, '').trim();
      if (!text) return null;
      const fraction = text.match(/^(?:(\d+)[\s-]+)?(\d+)\s*\/\s*(\d+)$/);
      const width = fraction ? Number(fraction[1] || 0) + Number(fraction[2]) / Number(fraction[3])
        : /^(?:\d+(?:\.\d*)?|\.\d+)$/.test(text) ? Number(text) : NaN;
      if (!Number.isFinite(width) || width <= 0) throw Error('Enter a positive width in inches, such as 1 3/4 or 1.75.');
      return width;
    }

    async function save(number, widthInches, sticksPerPass) {
      if (busy || !revision) return;
      busy = true;
      render();
      try {
        await request({ revision, number, widthInches, sticksPerPass });
        $('override-form').reset();
        message((overrides[number] ? 'Override saved for ' : 'Default settings restored for ') + number + '.');
      } catch (error) {
        if (error.status === 409) {
          try { await request(); } catch {}
        }
        message(error.message, true);
      } finally {
        busy = false;
        render();
      }
    }

    $('override-form').onsubmit = event => {
      event.preventDefault();
      try {
        const sticks = $('sticks').value ? Number($('sticks').value) : null;
        save($('number').value.trim(), parseWidth($('width').value), sticks);
      } catch (error) {
        message(error.message, true);
      }
    };

    try {
      await request();
      message('');
    } catch (error) {
      message(error.message, true);
    } finally {
      render();
    }
  </script>
</body>
</html>
